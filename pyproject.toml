[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "linkedin-lead-research-automation"
version = "0.1.0"
description = "A supervised, configuration-driven LinkedIn lead research backend."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "LinkedIn Lead Research Automation Contributors" }]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.116,<1",
  "google-api-python-client>=2.160,<3",
  "google-auth-oauthlib>=1.2,<2",
  "openpyxl>=3.1,<4",
  "playwright>=1.50,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "SQLAlchemy>=2.0.37,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
linkedin-automation = "linkedin_automation.interfaces.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_automation"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["linkedin_automation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["linkedin_automation"]

[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.*", "googleapiclient.*", "openpyxl.*", "yaml"]
ignore_missing_imports = true
