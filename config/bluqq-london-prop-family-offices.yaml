version: 2
name: bluqq-london-family-offices
search:
  titles:
    include:
      - Founder
      - Co-Founder
      - Chief Executive Officer
      - CEO
      - Chief Executive
      - Managing Partner
      - Chief Investment Officer
      - CIO
      - Principal
      - Partner
      - Managing Director
      - Head of Investments
      - Head of Investment
      - Investment Director
      - Portfolio Manager
      - Fund Manager
      - Chief Operating Officer
      - COO
      - Chief Technology Officer
      - CTO
    exclude:
      - Assistant
      - Intern
      - Student
      - Recruiter
  locations:
    - London
    - Greater London
  industries:
    - Investment Management
    - Financial Services
    - Capital Markets
  companies: []
  keywords:
    include:
      - family office
      - private investment office
      - single family office
      - multi family office
      - options
      - derivatives
      - multi-account
      - Interactive Brokers
    exclude:
      - recruitment
      - training course
  required_dimensions:
    - titles
    - locations
limits:
  max_results: 250
  max_pages: 24
  max_daily_results: 500
qualification:
  firm_types:
    - family office
    - private investment office
    - single family office
    - multi family office
  minimum_funds_gbp: 1000000
  require_fund_evidence: true
  executive_title_priority:
    - Founder
    - Co-Founder
    - Chief Executive Officer
    - CEO
    - Chief Executive
    - Managing Partner
    - Chief Investment Officer
    - CIO
    - Principal
    - Partner
    - Managing Director
    - Head of Investments
    - Head of Investment
    - Investment Director
    - Portfolio Manager
    - Fund Manager
    - Chief Operating Officer
    - COO
    - Chief Technology Officer
    - CTO
  minimum_score: 70
outreach:
  enabled: true
  manual_send_only: true
  connection_template: >-
    Hi {first_name}, I noticed your work at {company}. BluQQ builds privately owned trading
    automation and multi-account risk infrastructure for family offices. Open to connecting?
  message_template: >-
    Thanks for connecting, {first_name}. We help family offices turn options and trading workflows
    into monitored software on their own accounts: multi-account execution, risk controls,
    consolidated reporting, and an optional private AI layer. Everything is paper-validated and
    client-owned. Are any parts of the workflow at {company} still manual?
output:
  file_name: bluqq-london-family-offices.xlsx
  drive_folder_id_env: GOOGLE_DRIVE_FOLDER_ID
